# The labels of Verticopolis/.github, applied by the Sync labels workflow
# (.github/workflows/sync-labels.yml) on a push to main that changes this file,
# daily, and by hand. Keep each entry's shape: `name`, then a quoted six-digit
# `color`, then `description`. Colors are quoted so a YAML reader cannot turn a
# value like 5319e7 into a number.

labels:
  # --- type ---
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: documentation
    color: "0075ca"
    description: Docs, README, or setup fixes
  - name: task
    color: "ededed"
    description: Internal work with no user-facing report (the Task issue form)
  # --- state ---
  - name: needs-triage
    color: "fbca04"
    description: Not yet reviewed by a maintainer
  - name: needs-form
    color: "e4e669"
    description: The body does not follow its issue form (set by issue-form.yml)
  # --- contributor ---
  - name: good first issue
    color: "7057ff"
    description: Good entry point for newcomers
  - name: help wanted
    color: "008672"
    description: Maintainer would welcome help on this
