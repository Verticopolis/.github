name: PR template

# A pull request description keeps the sections of the repository's
# .github/PULL_REQUEST_TEMPLATE.md. GitHub fills the template in only when a PR
# is opened from the website; a body sent through the API or
# `gh pr create --body` replaces it. The rules are in checks/prTemplate.ts
# (with its tests); release PRs, Dependabot and other bots are skipped.
#
# Every Verticopolis repository calls this workflow from its own
# .github/workflows/pr-template.yml (on pull_request: opened, edited,
# reopened, synchronize, ready_for_review), so editing the description turns
# the check green without a push. The description is read as data through an
# environment variable, never interpolated into a script, and neither
# checkout keeps credentials.
on:
  workflow_call:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  description:
    name: PR template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request's repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
          sparse-checkout: .github

      - name: Check out the shared checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Verticopolis/.github
          ref: main
          path: org
          persist-credentials: false
          sparse-checkout: checks

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: org/.nvmrc

      - name: Check the description against the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node org/checks/pr-template-check.ts --root repo --branch "$HEAD_REF" --author "$AUTHOR"
