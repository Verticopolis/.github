name: 📚 Documentation issue
description: A README, guide or other page in this repository is wrong, unclear, or missing.
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Where is it?
      description: File and section, or a link to the page.
      placeholder: README.md → Build and test
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
      description: Quote the current text if it's an error, or describe what's absent.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: What should it say instead? A PR is welcome too.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
